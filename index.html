<style>
*{box-sizing:border-box;font-family:'Google Sans',Roboto,Arial,sans-serif}
body{background:#EEF2F7;color:#1E293B;font-size:13px;margin:0;padding:0}
.nav-btn{padding:6px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;border:none;background:transparent;color:#475569;display:inline-flex;align-items:center;gap:4px}
.nav-btn.active{background:#0284C7;color:#fff;box-shadow:0 2px 6px rgba(2,132,199,.3)}
.nav-btn:hover:not(.active){background:#E2E8F0}
.btn-primary{background:#0284C7;color:#fff;border:none;padding:6px 16px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.btn-primary:hover{background:#0369A1;box-shadow:0 2px 6px rgba(2,132,199,.3)}
.btn-danger{background:#DC2626;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:500}
.btn-danger:hover{background:#B91C1C}
.btn-secondary{background:#fff;color:#374151;border:1px solid #D1D5DB;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
.btn-secondary:hover{background:#F9FAFB;border-color:#9CA3AF}
.btn-success{background:#16A34A;color:#fff;border:none;padding:6px 16px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.btn-success:hover{background:#15803D;box-shadow:0 2px 6px rgba(22,163,74,.3)}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.input-sm{border:1px solid #D1D5DB;border-radius:6px;padding:6px 10px;font-size:12px;width:100%;outline:none;background:#fff;transition:border .15s}
.input-sm:focus{border-color:#0284C7;box-shadow:0 0 0 3px rgba(2,132,199,.12)}
.select-sm{border:1px solid #D1D5DB;border-radius:6px;padding:6px 10px;font-size:12px;width:100%;outline:none;background:#fff;cursor:pointer;transition:border .15s}
.select-sm:focus{border-color:#0284C7;box-shadow:0 0 0 3px rgba(2,132,199,.12)}
.label-sm{font-size:11px;font-weight:600;color:#6B7280;margin-bottom:4px;display:block;letter-spacing:.2px}
.table-hdr{background:#F8FAFC;font-size:11px;font-weight:700;color:#64748B;text-transform:uppercase;letter-spacing:.5px}
.table-row{border-bottom:1px solid #F1F5F9;font-size:12px;transition:background .1s}
.table-row:hover{background:#F8FAFC}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-narco{background:#FEE2E2;color:#991B1B}
.badge-sch{background:#FEF3C7;color:#92400E}
.badge-tb{background:#DBEAFE;color:#1E40AF}
.badge-normal{background:#DCFCE7;color:#166534}
.kpi-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-box{background:#fff;border-radius:12px;padding:20px 24px;max-width:680px;width:95%;max-height:92vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.tab-btn{padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;border:1px solid #D1D5DB;background:#fff;color:#475569;font-weight:500}
.tab-btn.active{background:#0284C7;color:#fff;border-color:#0284C7}
.alert-warn{background:#FFFBEB;border:1px solid #FCD34D;border-radius:6px;padding:6px 10px;font-size:11px;color:#92400E}
.alert-danger{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:6px;padding:6px 10px;font-size:11px;color:#991B1B}
.alert-success{background:#F0FDF4;border:1px solid #86EFAC;border-radius:6px;padding:6px 10px;font-size:11px;color:#166534}
.drag-zone{border:2px dashed #CBD5E1;border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:all .2s}
.drag-zone:hover{border-color:#0284C7;background:#F0F9FF}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#F1F5F9}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94A3B8}
.slide-in{animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pulse-badge{animation:pulse 2s infinite}
/* Invoice Print Styles */
@media print{
  #sysbar,#navBar,#mainContent,#modalsContainer .modal-overlay > *:not(.invoice-print-area){display:none!important}
  .invoice-print-area{display:block!important;position:fixed;top:0;left:0;width:100%;padding:0;margin:0}
  body{background:#fff}
}
</style>
</head>

  <div style="display:flex;align-items:center;gap:8px">
    <span class="label-sm" style="color:#94A3B8;margin:0;font-size:11px">Branch:</span>
    <select id="globalBranch" class="select-sm" style="width:140px;background:#1E293B;color:#E2E8F0;border-color:#334155;font-size:12px" onchange="onGlobalChange()">
      <option value="Anand Main">Anand Main</option>
      <option value="Vidyanagar">Vidyanagar</option>
      <option value="Karamsad">Karamsad</option>
    </select>
    <span class="label-sm" style="color:#94A3B8;margin:0;font-size:11px">FY:</span>
    <select id="globalFY" class="select-sm" style="width:90px;background:#1E293B;color:#E2E8F0;border-color:#334155;font-size:12px" onchange="onGlobalChange()">
      <option value="2026">2025-26</option>
      <option value="2025">2024-25</option>
    </select>
    <button onclick="toggleLang()" id="langBtn" style="background:#1E293B;color:#38BDF8;border:1px solid #334155;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600">EN | ગુ</button>
    <span style="color:#64748B;font-size:11px;font-family:monospace" id="clockDisplay"></span>
  </div>
</div>

<!-- NAVIGATION BAR -->
<div id="navBar" style="background:#fff;border-bottom:2px solid #E2E8F0;padding:6px 16px;display:flex;align-items:center;gap:6px;position:sticky;top:38px;z-index:499;box-shadow:0 2px 8px rgba(0,0,0,.06)">
  <button class="nav-btn active" id="nav-dashboard" onclick="showView('dashboard')">
    <span data-lucide="layout-dashboard" style="width:13px;height:13px;display:inline-block;vertical-align:middle"></span>
    <span class="t" data-key="nav_dashboard">Dashboard</span>
  </button>
  <button class="nav-btn" id="nav-billing" onclick="showView('billing')">
    <span data-lucide="receipt" style="width:13px;height:13px;display:inline-block;vertical-align:middle"></span>
    <span class="t" data-key="nav_billing">Billing / POS</span>
  </button>
  <button class="nav-btn" id="nav-purchase" onclick="showView('purchase')">
    <span data-lucide="package-plus" style="width:13px;height:13px;display:inline-block;vertical-align:middle"></span>
    <span class="t" data-key="nav_purchase">Purchase</span>
  </button>
  <button class="nav-btn" id="nav-stock" onclick="showView('stock')">
    <span data-lucide="boxes" style="width:13px;height:13px;display:inline-block;vertical-align:middle"></span>
    <span class="t" data-key="nav_stock">Stock Matrix</span>
  </button>
  <button class="nav-btn" id="nav-settings" onclick="showView('settings')">
    <span data-lucide="settings" style="width:13px;height:13px;display:inline-block;vertical-align:middle"></span>
    <span class="t" data-key="nav_settings">Settings</span>
  </button>
  <div style="flex:1"></div>
  <span id="globalNotif" style="font-size:11px;color:#DC2626;font-weight:600"></span>
</div>

<!-- MAIN CONTENT AREA -->
<div id="mainContent" style="padding:14px 16px">
</div>

<!-- MODALS CONTAINER -->
<div id="modalsContainer"></div>

function t(key) {
  return (LANG[STATE.lang] && LANG[STATE.lang][key]) || LANG.en[key] || key;
}

function toggleLang() {
  STATE.lang = STATE.lang === 'en' ? 'gu' : 'en';
  document.querySelectorAll('.t[data-key]').forEach(el => {
    el.textContent = t(el.dataset.key);
  });
  renderCurrentView();
}

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function getMed(id) { return STATE.medicines.find(m => m.id === id); }
function getBranch() { return STATE.currentBranch; }
function getFY() { return STATE.currentFY; }
function getInventory() {
  return (STATE.inventory[getFY()] && STATE.inventory[getFY()][getBranch()]) || [];
}
function getSales() {
  return (STATE.sales[getFY()] && STATE.sales[getFY()][getBranch()]) || [];
}
function getPurchases() {
  return (STATE.purchases[getFY()] && STATE.purchases[getFY()][getBranch()]) || [];
}
function ensureInventoryPath(fy, branch) {
  if (!STATE.inventory[fy]) STATE.inventory[fy] = {};
  if (!STATE.inventory[fy][branch]) STATE.inventory[fy][branch] = [];
}
function ensureSalesPath(fy, branch) {
  if (!STATE.sales[fy]) STATE.sales[fy] = {};
  if (!STATE.sales[fy][branch]) STATE.sales[fy][branch] = [];
}
function ensurePurchasePath(fy, branch) {
  if (!STATE.purchases[fy]) STATE.purchases[fy] = {};
  if (!STATE.purchases[fy][branch]) STATE.purchases[fy][branch] = [];
}

function formatQty(qty, med) {
  if (!med || med.tabletsPerStrip <= 1) return qty.toFixed(2);
  const strips = Math.floor(qty);
  const tablets = Math.round((qty - strips) * med.tabletsPerStrip);
  if (tablets === 0) return strips + ' Strips';
  if (strips === 0) return tablets + ' Tabs';
  return strips + ' Strips + ' + tablets + ' Tabs';
}

function qtyToStrips(tablets, med) {
  if (!med || med.tabletsPerStrip <= 1) return tablets;
  return tablets / med.tabletsPerStrip;
}

function stripsToTablets(strips, med) {
  if (!med || med.tabletsPerStrip <= 1) return strips;
  return strips * med.tabletsPerStrip;
}

function calcGST(amount, gstPct) {
  return (amount * gstPct) / (100 + gstPct);
}

function formatCurrency(n) {
  return '₹' + parseFloat(n || 0).toFixed(2);
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d + (d.length === 7 ? '-01' : ''));
  return dt.toLocaleDateString('en-IN', {month:'short', year:'numeric'});
}

function daysToExpiry(expiryStr) {
  const exp = new Date(expiryStr + '-01');
  exp.setMonth(exp.getMonth() + 1);
  exp.setDate(0);
  const now = new Date();
  return Math.floor((exp - now) / (1000 * 60 * 60 * 24));
}

function genId(prefix) {
  return prefix + Date.now().toString(36).toUpperCase();
}

function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;bottom:16px;right:16px;z-index:9999;padding:8px 14px;border-radius:6px;font-size:11px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s ease;max-width:280px`;
  t.style.background = type === 'success' ? '#16A34A' : type === 'warn' ? '#D97706' : '#DC2626';
  t.style.color = '#fff';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function closeModal() {
  document.getElementById('modalsContainer').innerHTML = '';
}

function onGlobalChange() {
  STATE.currentBranch = document.getElementById('globalBranch').value;
  STATE.currentFY = document.getElementById('globalFY').value;
  renderCurrentView();
  updateGlobalNotif();
}

function updateGlobalNotif() {
  const inv = getInventory();
  const lowCount = inv.filter(i => i.qty <= 5).length;
  const expCount = inv.filter(i => daysToExpiry(i.expiry) < 90).length;
  const el = document.getElementById('globalNotif');
  if (el) {
    let msgs = [];
    if (lowCount > 0) msgs.push('⚠ ' + lowCount + ' Low Stock');
    if (expCount > 0) msgs.push('🔴 ' + expCount + ' Near Expiry');
    el.textContent = msgs.join('  ');
  }
}

function updateClock() {
  const el = document.getElementById('clockDisplay');
  if (el) el.textContent = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

function showView(view) {
  STATE.currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const nb = document.getElementById('nav-' + view);
  if (nb) nb.classList.add('active');
  renderCurrentView();
}

function renderCurrentView() {
  const mc = document.getElementById('mainContent');
  if (!mc) return;
  mc.innerHTML = '';
  if (STATE.currentView === 'dashboard') renderDashboard();
  else if (STATE.currentView === 'billing') renderBilling();
  else if (STATE.currentView === 'purchase') renderPurchase();
  else if (STATE.currentView === 'stock') renderStock();
  else if (STATE.currentView === 'settings') renderSettings();
  lucide.createIcons();
  updateGlobalNotif();
}

function addBranch() {
  const name = document.getElementById('newBranchName').value.trim();
  if (!name) { showToast('Enter branch name', 'error'); return; }
  if (STATE.branches.includes(name)) { showToast('Branch already exists', 'warn'); return; }
  STATE.branches.push(name);
  // Add to global dropdowns
  ['globalBranch'].forEach(id => {
    const sel = document.getElementById(id);
    if (sel) { const opt = document.createElement('option'); opt.value = name; opt.textContent = name; sel.appendChild(opt); }
  });
  // Initialize inventory/sales/purchases for new branch
  Object.keys(STATE.inventory).forEach(fy => { if (!STATE.inventory[fy][name]) STATE.inventory[fy][name] = []; });
  Object.keys(STATE.sales).forEach(fy => { if (!STATE.sales[fy][name]) STATE.sales[fy][name] = []; });
  Object.keys(STATE.purchases).forEach(fy => { if (!STATE.purchases[fy][name]) STATE.purchases[fy][name] = []; });
  showToast('Branch "' + name + '" added successfully');
  renderCurrentView();
}

function recordPayment(caId) {
  const ca = STATE.customerAccounts.find(c => c.id === caId);
  if (!ca) return;
  const amt = parseFloat(prompt(`Record payment for ${ca.name}\nOutstanding: ${formatCurrency(ca.balance)}\nEnter amount paid:`));
  if (isNaN(amt) || amt <= 0) return;
  const pay = Math.min(amt, ca.balance);
  ca.balance = parseFloat((ca.balance - pay).toFixed(2));
  ca.transactions.push({date: new Date().toISOString().split('T')[0], type:'payment', amount:pay, invoiceNo:'', note:'Cash payment received'});
  showToast(`Payment of ${formatCurrency(pay)} recorded for ${ca.name}`);
  showUdhaarModal();
}

function recordSupplierPayment(saId) {
  const sa = STATE.supplierAccounts.find(s => s.id === saId);
  if (!sa) return;
  const amt = parseFloat(prompt(`Record payment to ${sa.name}\nPayable: ${formatCurrency(sa.balance)}\nEnter amount paid:`));
  if (isNaN(amt) || amt <= 0) return;
  const pay = Math.min(amt, sa.balance);
  sa.balance = parseFloat((sa.balance - pay).toFixed(2));
  sa.transactions.push({date: new Date().toISOString().split('T')[0], type:'payment', amount:pay, note:'Payment made'});
  showToast(`Payment of ${formatCurrency(pay)} recorded to ${sa.name}`);
  showUdhaarModal();
}

function onBillMedChange() {
  const medId = document.getElementById('billMedSelect').value;
  const batchSel = document.getElementById('billBatchSelect');
  const infoBar = document.getElementById('batchInfoBar');
  batchSel.innerHTML = '<option value="">-- Select Batch --</option>';
  infoBar.textContent = '';
  if (!medId) return;
  const inv = getInventory().filter(i => i.medId === medId && i.qty > 0);
  if (inv.length === 0) { infoBar.textContent = '⚠ No stock available in this branch'; infoBar.style.color = '#DC2626'; return; }
  inv.forEach(item => {
    const med = getMed(medId);
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = `Batch: ${item.batch} | Exp: ${formatDate(item.expiry)} | Stock: ${formatQty(item.qty, med)} | MRP: ${formatCurrency(item.mrp)}`;
    batchSel.appendChild(opt);
  });
}

function onBillBatchChange() {
  const invId = document.getElementById('billBatchSelect').value;
  const infoBar = document.getElementById('batchInfoBar');
  if (!invId) { infoBar.textContent = ''; return; }
  const item = getInventory().find(i => i.id === invId);
  if (!item) return;
  const med = getMed(item.medId);
  const days = daysToExpiry(item.expiry);
  infoBar.innerHTML = `<span style="color:${days<30?'#DC2626':days<90?'#D97706':'#16A34A'}">Expiry: ${formatDate(item.expiry)} (${days} days) | Available: ${formatQty(item.qty, med)} | MRP: ${formatCurrency(item.mrp)} | GST: ${med?med.gst:0}%</span>`;
}

function addToCart() {
  const medId = document.getElementById('billMedSelect').value;
  const invId = document.getElementById('billBatchSelect').value;
  const strips = parseFloat(document.getElementById('billQty').value) || 0;
  const looseTablets = parseInt(document.getElementById('billLooseTablets').value) || 0;
  if (!medId || !invId) { showToast('Select medicine and batch', 'error'); return; }
  const med = getMed(medId);
  const invItem = getInventory().find(i => i.id === invId);
  if (!invItem) { showToast('Batch not found', 'error'); return; }
  const totalQty = strips + (med.tabletsPerStrip > 1 ? looseTablets / med.tabletsPerStrip : looseTablets);
  if (totalQty <= 0) { showToast('Enter valid quantity', 'error'); return; }
  if (totalQty > invItem.qty) { showToast(`Only ${formatQty(invItem.qty, med)} available`, 'warn'); return; }
  const existing = STATE.cart.find(c => c.invId === invId);
  if (existing) {
    existing.qty = parseFloat((existing.qty + totalQty).toFixed(4));
    if (existing.qty > invItem.qty) { existing.qty = invItem.qty; showToast('Max stock reached', 'warn'); }
  } else {
    STATE.cart.push({
      medId, invId, medName: med.name, batch: invItem.batch,
      qty: parseFloat(totalQty.toFixed(4)), mrp: invItem.mrp,
      gst: med.gst, tabletsPerStrip: med.tabletsPerStrip,
      expiry: invItem.expiry
    });
  }
  document.getElementById('cartTableContainer').innerHTML = renderCartTable();
  updateCartSummary();
  showToast(`${med.name} added to cart`);
}

function renderCartTable() {
  if (STATE.cart.length === 0) return `<div style="padding:16px;text-align:center;color:#94A3B8;font-size:11px">${t('cart_empty')}</div>`;
  return `
  <table style="width:100%;border-collapse:collapse">
    <thead><tr class="table-hdr">
      <th style="padding:3px 4px;text-align:left">Medicine</th>
      <th style="padding:3px 4px;text-align:left">Batch</th>
      <th style="padding:3px 4px;text-align:center">Qty</th>
      <th style="padding:3px 4px;text-align:right">MRP</th>
      <th style="padding:3px 4px;text-align:right">GST%</th>
      <th style="padding:3px 4px;text-align:right">Total</th>
      <th style="padding:3px 4px;text-align:center">Del</th>
    </tr></thead>
    <tbody>
    ${STATE.cart.map((item, idx) => {
      const med = getMed(item.medId);
      const lineTotal = item.qty * item.mrp;
      const gstAmt = calcGST(lineTotal, item.gst);
      return `<tr class="table-row">
        <td style="padding:3px 4px;font-size:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.medName}</td>
        <td style="padding:3px 4px;font-size:9px;color:#64748B">${item.batch}</td>
        <td style="padding:3px 4px;text-align:center">
          <div style="display:flex;align-items:center;gap:2px;justify-content:center">
            <button onclick="changeCartQty(${idx},-0.1)" style="background:#F1F5F9;border:1px solid #CBD5E1;border-radius:3px;width:16px;height:16px;cursor:pointer;font-size:10px;line-height:1">-</button>
            <span style="font-size:10px;min-width:50px;text-align:center">${formatQty(item.qty, med)}</span>
            <button onclick="changeCartQty(${idx},0.1)" style="background:#F1F5F9;border:1px solid #CBD5E1;border-radius:3px;width:16px;height:16px;cursor:pointer;font-size:10px;line-height:1">+</button>
          </div>
        </td>
        <td style="padding:3px 4px;text-align:right;font-size:10px">${formatCurrency(item.mrp)}</td>
        <td style="padding:3px 4px;text-align:right;font-size:10px">${item.gst}%</td>
        <td style="padding:3px 4px;text-align:right;font-weight:600;font-size:10px">${formatCurrency(lineTotal)}</td>
        <td style="padding:3px 4px;text-align:center"><button class="btn-danger" onclick="removeFromCart(${idx})">✕</button></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;
}

function changeCartQty(idx, delta) {
  const item = STATE.cart[idx];
  if (!item) return;
  const invItem = getInventory().find(i => i.id === item.invId);
  const newQty = parseFloat((item.qty + delta).toFixed(4));
  if (newQty <= 0) { removeFromCart(idx); return; }
  if (invItem && newQty > invItem.qty) { showToast('Max stock reached', 'warn'); return; }
  item.qty = newQty;
  document.getElementById('cartTableContainer').innerHTML = renderCartTable();
  updateCartSummary();
}

function removeFromCart(idx) {
  STATE.cart.splice(idx, 1);
  document.getElementById('cartTableContainer').innerHTML = renderCartTable();
  updateCartSummary();
}

function getCartTotals() {
  let subtotal = 0, gstTotal = 0;
  STATE.cart.forEach(item => {
    const lineTotal = item.qty * item.mrp;
    subtotal += lineTotal;
    gstTotal += calcGST(lineTotal, item.gst);
  });
  const discFlat = parseFloat(document.getElementById('discFlat')?.value || 0) || 0;
  const discPct = parseFloat(document.getElementById('discPct')?.value || 0) || 0;
  const discAmt = discFlat + (subtotal * discPct / 100);
  const netPayable = Math.max(0, subtotal - discAmt);
  return { subtotal, gstTotal, discAmt, netPayable };
}

function renderCartSummary() {
  const { subtotal, gstTotal, discAmt, netPayable } = getCartTotals();
  return `
  <div style="border-top:1px solid #F1F5F9;padding-top:6px">
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px">
      <span style="color:#64748B">Subtotal</span><span>${formatCurrency(subtotal)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px">
      <span style="color:#64748B">GST (incl.)</span><span>${formatCurrency(gstTotal)}</span>
    </div>
    ${discAmt>0?`<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;color:#16A34A">
      <span>Discount</span><span>- ${formatCurrency(discAmt)}</span>
    </div>`:''}
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;border-top:1px solid #CBD5E1;padding-top:4px;margin-top:4px">
      <span>${t('net_payable')}</span><span style="color:#0284C7">${formatCurrency(netPayable)}</span>
    </div>
  </div>`;
}

function updateCartSummary() {
  const el = document.getElementById('cartSummaryBlock');
  if (el) el.innerHTML = renderCartSummary();
}

function completeBill() {
  const custName = document.getElementById('billCustName').value.trim();
  const custMobile = document.getElementById('billCustMobile').value.trim();
  if (!custName || !custMobile) { showToast('Customer name and mobile are required', 'error'); return; }
  if (STATE.cart.length === 0) { showToast('Cart is empty', 'error'); return; }
  const { subtotal, gstTotal, discAmt, netPayable } = getCartTotals();
  const isUdhaar = document.getElementById('billUdhaar').checked;
  const invoiceNo = 'INV-' + (++STATE.invoiceCounter);
  const today = new Date().toISOString().split('T')[0];
  const saleItems = STATE.cart.map(item => ({
    medId: item.medId, batch: item.batch, qty: item.qty,
    mrp: item.mrp, gst: item.gst, discount: 0
  }));
  const saleRecord = {
    id: genId('S'), invoiceNo, date: today,
    customer: custName, mobile: custMobile,
    items: saleItems, total: netPayable,
    gstTotal, mode: isUdhaar ? 'udhaar' : 'cash', udhaar: isUdhaar
  };
  ensureSalesPath(getFY(), getBranch());
  STATE.sales[getFY()][getBranch()].push(saleRecord);
  // Deduct inventory
  STATE.cart.forEach(item => {
    const invItem = getInventory().find(i => i.id === item.invId);
    if (invItem) invItem.qty = parseFloat((invItem.qty - item.qty).toFixed(4));
  });
  // Update udhaar if credit
  if (isUdhaar) {
    let ca = STATE.customerAccounts.find(c => c.mobile === custMobile);
    if (!ca) {
      ca = {id: genId('CA'), name: custName, mobile: custMobile, balance: 0, transactions: []};
      STATE.customerAccounts.push(ca);
    }
    ca.balance = parseFloat((ca.balance + netPayable).toFixed(2));
    ca.transactions.push({date: today, type:'credit', amount: netPayable, invoiceNo, note:'Medicine purchase'});
  }
  const savedCart = [...STATE.cart];
  STATE.cart = [];
  STATE.billCustName = '';
  STATE.billCustMobile = '';
  showBillSuccessModal(saleRecord, savedCart, netPayable, gstTotal);
}

function downloadPDF(saleId) {
  const allSales = Object.values(STATE.sales[getFY()]||{}).flat();
  const sale = allSales.find(s => s.id === saleId);
  if (!sale) return;
  const cartItems = sale.items;
  const html = `<!DOCTYPE html><html><head><title>${sale.invoiceNo}</title><style>body{font-family:Arial,sans-serif;font-size:11px;padding:20px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:4px 6px}th{background:#f5f5f5}</style></head><body>${generateInvoiceHTML(sale, cartItems, sale.total, sale.gstTotal)}</body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = sale.invoiceNo + '.html';
  a.click(); URL.revokeObjectURL(url);
  showToast('Invoice downloaded as HTML');
}

function thermalPrint(saleId) {
  const allSales = Object.values(STATE.sales[getFY()]||{}).flat();
  const sale = allSales.find(s => s.id === saleId);
  if (!sale) return;
  const w = window.open('', '_blank', 'width=320,height=600');
  w.document.write(`<!DOCTYPE html><html><head><title>Thermal Print</title><style>body{font-family:monospace;font-size:10px;width:280px;margin:0 auto}@media print{body{width:280px}}</style></head><body>${generateInvoiceHTML(sale, sale.items, sale.total, sale.gstTotal)}<script>window.print();<\/script></body></html>`);

}

function addToPurchaseCart() {
  const medId = document.getElementById('purchMedSelect').value;
  const batch = document.getElementById('purchBatch').value.trim();
  const expiryRaw = document.getElementById('purchExpiry').value.trim();
  const pts = parseFloat(document.getElementById('purchPTS').value) || 0;
  const mrp = parseFloat(document.getElementById('purchMRP').value) || 0;
  const qty = parseFloat(document.getElementById('purchQty').value) || 0;
  const rack = document.getElementById('purchRack').value.trim();
  if (!medId) { showToast('Select a medicine', 'error'); return; }
  if (!batch) { showToast('Enter batch number', 'error'); return; }
  if (!expiryRaw) { showToast('Enter expiry date', 'error'); return; }
  if (pts <= 0 || mrp <= 0 || qty <= 0) { showToast('Enter valid PTS, MRP and Quantity', 'error'); return; }
  // Parse expiry MM/YYYY -> YYYY-MM
  const parts = expiryRaw.split('/');
  if (parts.length !== 2) { showToast('Expiry format: MM/YYYY', 'error'); return; }
  const expiry = parts[1] + '-' + parts[0].padStart(2,'0');
  const med = getMed(medId);
  STATE.purchaseCart.push({ medId, medName: med.name, batch, expiry, pts, mrp, qty, rack });
  document.getElementById('purchCartContainer').innerHTML = renderPurchaseCart();
  document.getElementById('purchSummary').innerHTML = renderPurchaseSummary();
  clearPurchaseForm();
  showToast(med.name + ' added to purchase list');
}

function commitPurchase() {
  if (STATE.purchaseCart.length === 0) { showToast('No items in purchase list', 'error'); return; }
  const suppId = document.getElementById('purchSupplier').value;
  const payStatus = document.getElementById('purchPayStatus').value;
  const amtPaid = payStatus === 'partial' ? (parseFloat(document.getElementById('purchAmtPaid').value) || 0) : null;
  const suppAcc = STATE.supplierAccounts.find(s => s.id === suppId);
  const suppName = suppAcc ? suppAcc.name : 'Other';
  const total = STATE.purchaseCart.reduce((a, i) => a + i.pts * i.qty, 0);
  const paid = payStatus === 'paid' ? total : (amtPaid || 0);
  const credit = total - paid;
  const today = new Date().toISOString().split('T')[0];
  ensureInventoryPath(getFY(), getBranch());
  ensurePurchasePath(getFY(), getBranch());
  const purchItems = [];
  STATE.purchaseCart.forEach(item => {
    const existing = getInventory().find(i => i.medId === item.medId && i.batch === item.batch);
    if (existing) {
      existing.qty = parseFloat((existing.qty + item.qty).toFixed(4));
      existing.mrp = item.mrp;
      existing.pts = item.pts;
    } else {
      const newInv = {
        id: genId('INV'), medId: item.medId, batch: item.batch,
        expiry: item.expiry, pts: item.pts, mrp: item.mrp,
        rack: item.rack || 'TBD', qty: item.qty, unit: 'strips'
      };
      STATE.inventory[getFY()][getBranch()].push(newInv);
    }
    purchItems.push({ medId: item.medId, batch: item.batch, qty: item.qty, pts: item.pts });
  });
  STATE.purchases[getFY()][getBranch()].push({
    id: genId('P'), date: today, supplier: suppName,
    items: purchItems, total, paid, credit
  });
  if (suppAcc && credit > 0) {
    suppAcc.balance = parseFloat((suppAcc.balance + credit).toFixed(2));
    suppAcc.transactions.push({ date: today, type:'purchase', amount: total, note:'Stock purchase' });
    if (paid > 0) suppAcc.transactions.push({ date: today, type:'payment', amount: paid, note:'Partial payment at purchase' });
  }
  const count = STATE.purchaseCart.length;
  STATE.purchaseCart = [];
  showToast(`${count} items committed to inventory. Credit: ${formatCurrency(credit)}`);
  renderCurrentView();
}

function getAggregatedStock(branchFilter) {
  const fy = getFY();
  const result = {};
  const branches = branchFilter ? [branchFilter] : STATE.branches;
  branches.forEach(br => {
    const inv = (STATE.inventory[fy] && STATE.inventory[fy][br]) || [];
    inv.forEach(item => {
      if (!result[item.medId]) result[item.medId] = { totalQty: 0, batches: [], rack: item.rack, latestMrp: 0, latestPts: 0 };
      result[item.medId].totalQty = parseFloat((result[item.medId].totalQty + item.qty).toFixed(4));
      result[item.medId].batches.push({ ...item, branch: br });
      result[item.medId].rack = item.rack;
      result[item.medId].latestMrp = item.mrp;
      result[item.medId].latestPts = item.pts;
    });
  });
  return result;
}

function filterStockTable() {
  const search = (document.getElementById('stockSearch')?.value || '').toLowerCase();
  const classFilter = document.getElementById('stockClassFilter')?.value || '';
  const branchFilter = document.getElementById('stockBranchFilter')?.value || '';
  const aggStock = getAggregatedStock(branchFilter);
  let rows = [];
  let totalValue = 0;
  STATE.medicines.forEach(med => {
    if (classFilter && med.category !== classFilter) return;
    if (search && !med.name.toLowerCase().includes(search) &&
        !med.company.toLowerCase().includes(search) &&
        !med.hsn.includes(search)) return;
    const stockData = aggStock[med.id];
    const totalQty = stockData ? stockData.totalQty : 0;
    const rack = stockData ? stockData.rack : '—';
    const mrp = stockData ? stockData.latestMrp : 0;
    const pts = stockData ? stockData.latestPts : 0;
    const stockVal = totalQty * pts;
    totalValue += stockVal;
    rows.push({ med, totalQty, rack, mrp, pts, stockVal, stockData });
  });
  const tbody = document.getElementById('stockTableBody');
  const countEl = document.getElementById('stockCount');
  const footerEl = document.getElementById('stockFooter');
  if (countEl) countEl.textContent = rows.length + ' products';
  if (footerEl) footerEl.innerHTML = `<span>Total Products: <strong>${rows.length}</strong></span><span>Total Stock Value (PTS): <strong style="color:#0284C7">${formatCurrency(totalValue)}</strong></span>`;
  if (!tbody) return;
  tbody.innerHTML = rows.map(({ med, totalQty, rack, mrp, pts, stockVal, stockData }) => {
    const badgeClass = med.category === 'Narcotics' ? 'badge-narco' :
                       med.category.startsWith('Schedule') ? 'badge-sch' :
                       med.category === 'Anti-TB' ? 'badge-tb' : 'badge-normal';
    const lowStock = totalQty > 0 && totalQty <= 5;
    const noStock = totalQty === 0;
    const nearExp = stockData && stockData.batches.some(b => daysToExpiry(b.expiry) < 90);
    return `<tr class="table-row" style="${noStock?'opacity:.55':''}${lowStock?'background:#FFFBEB;':nearExp&&!lowStock?'background:#FFF7ED;':''}">
      <td style="padding:4px 6px">
        <span style="font-weight:600;color:#0284C7;cursor:pointer;text-decoration:underline;text-decoration-style:dotted" onclick="showProductDossier('${med.id}')">${med.name}</span>
        ${lowStock?'<span class="badge badge-narco pulse-badge" style="margin-left:4px">Low</span>':''}
        ${noStock?'<span class="badge" style="background:#F1F5F9;color:#94A3B8;margin-left:4px">Out</span>':''}
        ${nearExp&&!noStock?'<span class="badge badge-sch" style="margin-left:4px">Exp</span>':''}

      <td style="padding:4px 6px;font-size:10px;color:#64748B">${med.company}</td>

      <td style="padding:4px 6px;text-align:center"><span class="badge ${badgeClass}">${med.category}</span></td>
      <td style="padding:4px 6px;text-align:right;font-weight:700;font-size:11px;color:${noStock?'#94A3B8':lowStock?'#D97706':'#1E293B'}">${formatQty(totalQty, med)}</td>

function deleteSpecificBatch(invId, branch, medName) {
  if (!confirm(`Delete this batch from ${branch} for "${medName}"?\nThis cannot be undone.`)) return;
  const fy = getFY();
  if (STATE.inventory[fy] && STATE.inventory[fy][branch]) {
    STATE.inventory[fy][branch] = STATE.inventory[fy][branch].filter(i => i.id !== invId);
  }
  showToast('Batch deleted from ' + branch);
  closeModal();
  filterStockTable();
}

function deleteInventoryItem(medId) {
  const med = getMed(medId);
  if (!confirm(`Drop ALL stock of "${med ? med.name : medId}" from ${getBranch()} (FY ${getFY()})?\nThis cannot be undone.`)) return;
  const fy = getFY();
  const br = getBranch();
  if (STATE.inventory[fy] && STATE.inventory[fy][br]) {
    STATE.inventory[fy][br] = STATE.inventory[fy][br].filter(i => i.medId !== medId);
  }
  showToast('All stock of ' + (med ? med.name : medId) + ' dropped from ' + br);
  filterStockTable();
}

function exportStockCSV() {
  const branchFilter = document.getElementById('stockBranchFilter')?.value || '';
  const aggStock = getAggregatedStock(branchFilter);
  let csv = 'Medicine Name,Company,Packing,HSN,GST%,Category,Rack,Total Stock,MRP,PTS,Stock Value\n';
  STATE.medicines.forEach(med => {
    const stockData = aggStock[med.id];
    const totalQty = stockData ? stockData.totalQty : 0;
    const rack = stockData ? stockData.rack : '';
    const mrp = stockData ? stockData.latestMrp : 0;
    const pts = stockData ? stockData.latestPts : 0;
    csv += `"${med.name}","${med.company}","${med.packing}","${med.hsn}",${med.gst}%,"${med.category}","${rack}",${totalQty},${mrp},${pts},${(totalQty*pts).toFixed(2)}\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `stock_${getBranch().replace(/ /g,'_')}_FY${getFY()}_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Stock CSV exported successfully');
}

function importInventory(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const lines = e.target.result.split('\n').filter(l => l.trim());
    let imported = 0;
    lines.slice(1).forEach(line => {
      const cols = line.split(',').map(c => c.replace(/"/g,'').trim());
      if (cols.length < 7) return;
      const med = STATE.medicines.find(m => m.name.toLowerCase() === cols[0].toLowerCase());
      if (!med) return;
      ensureInventoryPath(getFY(), getBranch());
      STATE.inventory[getFY()][getBranch()].push({
        id: genId('INV'), medId: med.id,
        batch: cols[1] || 'IMPORT', expiry: cols[2] || '2027-12',
        pts: parseFloat(cols[3]) || 0, mrp: parseFloat(cols[4]) || 0,
        rack: cols[5] || 'TBD', qty: parseFloat(cols[6]) || 0, unit: 'strips'
      });
      imported++;
    });
    showToast(`Imported ${imported} items into ${getBranch()}`);
    filterStockTable();
  };
  reader.readAsText(file);
  input.value = '';
}

function handleSigUpload(input) {

  const reader = new FileReader();
  reader.onload = e => { STATE.signatureImg = e.target.result; renderCurrentView(); showToast('Signature uploaded'); };

}

function handleSigDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];

  const reader = new FileReader();

}

function addNewMedicine() {
  const name = document.getElementById('newMedName').value.trim();
  const packing = document.getElementById('newMedPacking').value.trim();
  const company = document.getElementById('newMedCompany').value.trim();
  const hsn = document.getElementById('newMedHSN').value.trim();
  const gst = parseInt(document.getElementById('newMedGST').value);
  const tabs = parseInt(document.getElementById('newMedTabs').value) || 10;
  const cat = document.getElementById('newMedCat').value;
  if (!name || !company) { showToast('Medicine name and company are required', 'error'); return; }
  if (STATE.medicines.find(m => m.name.toLowerCase() === name.toLowerCase())) {
    showToast('Medicine already exists in catalog', 'warn'); return;
  }
  const newId = 'M' + String(STATE.medicines.length + 1).padStart(3, '0');
  STATE.medicines.push({ id: newId, name, packing: packing || '1x10 Strip', company, hsn: hsn || '30049099', gst, tabletsPerStrip: tabs, category: cat });
  showToast(name + ' added to master catalog');
  renderCurrentView();
}

function exportFullBackup() {
  const data = JSON.stringify(STATE, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `eatnbill_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Full backup exported');
}

function importBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      Object.assign(STATE, data);
      showToast('Backup imported successfully');
      renderCurrentView();
    } catch(err) { showToast('Invalid backup file', 'error'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function showGSTReport() {
  const fy = getFY();
  let gst5 = 0, gst12 = 0, gst18 = 0, totalSales = 0, totalBills = 0;
  const monthlyData = {};
  STATE.branches.forEach(br => {
    const bSales = (STATE.sales[fy] && STATE.sales[fy][br]) || [];
    bSales.forEach(s => {
      totalSales += s.total;
      totalBills++;
      const mo = s.date.substring(0, 7);
      if (!monthlyData[mo]) monthlyData[mo] = { sales: 0, gst: 0, count: 0 };
      monthlyData[mo].sales += s.total;
      monthlyData[mo].gst += s.gstTotal;
      monthlyData[mo].count++;
      s.items.forEach(item => {
        const med = getMed(item.medId);
        if (!med) return;
        const lineTotal = item.qty * item.mrp;
        const gstAmt = calcGST(lineTotal, med.gst);
        if (med.gst === 5) gst5 += gstAmt;
        else if (med.gst === 12) gst12 += gstAmt;
        else if (med.gst === 18) gst18 += gstAmt;

        </div>

function loadTransferStock() {
  const fromBranch = document.getElementById('transferFrom')?.value;
  if (!fromBranch) return;
  const inv = (STATE.inventory[getFY()] && STATE.inventory[getFY()][fromBranch]) || [];
  const sel = document.getElementById('transferBatch');
  if (!sel) return;
  sel.innerHTML = '<option value="">-- Select Batch --</option>';
  inv.filter(i => i.qty > 0).forEach(item => {
    const med = getMed(item.medId);
    const opt = document.createElement('option');
    opt.value = item.id;
    opt.textContent = `${med ? med.name : item.medId} | Batch: ${item.batch} | ${formatQty(item.qty, med)}`;
    sel.appendChild(opt);
  });
}

function showTransferBatchInfo() {
  const fromBranch = document.getElementById('transferFrom')?.value;
  const invId = document.getElementById('transferBatch')?.value;
  const infoEl = document.getElementById('transferStockInfo');
  if (!infoEl) return;
  if (!invId || !fromBranch) { infoEl.textContent = ''; return; }
  const inv = (STATE.inventory[getFY()] && STATE.inventory[getFY()][fromBranch]) || [];
  const item = inv.find(i => i.id === invId);
  if (!item) return;
  const med = getMed(item.medId);
  infoEl.innerHTML = `Available: <strong>${formatQty(item.qty, med)}</strong> &nbsp;|&nbsp; Expiry: <strong>${formatDate(item.expiry)}</strong> &nbsp;|&nbsp; MRP: <strong>${formatCurrency(item.mrp)}</strong> &nbsp;|&nbsp; Rack: <strong>${item.rack}</strong>`;
}

function executeTransfer() {
  const fromBranch = document.getElementById('transferFrom').value;
  const toBranch = document.getElementById('transferTo').value;
  const invId = document.getElementById('transferBatch').value;
  const qty = parseFloat(document.getElementById('transferQty').value) || 0;
  if (fromBranch === toBranch) { showToast('Source and destination must be different', 'error'); return; }
  if (!invId) { showToast('Select a batch to transfer', 'error'); return; }
  if (qty <= 0) { showToast('Enter valid quantity', 'error'); return; }
  const fy = getFY();
  const fromInv = (STATE.inventory[fy] && STATE.inventory[fy][fromBranch]) || [];
  const srcItem = fromInv.find(i => i.id === invId);
  if (!srcItem) { showToast('Source batch not found', 'error'); return; }
  if (qty > srcItem.qty) { showToast(`Only ${formatQty(srcItem.qty, getMed(srcItem.medId))} available`, 'error'); return; }
  ensureInventoryPath(fy, toBranch);
  const toInv = STATE.inventory[fy][toBranch];
  const existing = toInv.find(i => i.medId === srcItem.medId && i.batch === srcItem.batch);
  if (existing) {
    existing.qty = parseFloat((existing.qty + qty).toFixed(4));
  } else {
    toInv.push({ ...srcItem, id: genId('INV'), qty: parseFloat(qty.toFixed(4)) });
  }
  srcItem.qty = parseFloat((srcItem.qty - qty).toFixed(4));
  const med = getMed(srcItem.medId);
  showToast(`${formatQty(qty, med)} of ${med ? med.name : ''} transferred: ${fromBranch} → ${toBranch}`);
  closeModal();
  if (STATE.currentView === 'stock') filterStockTable();
}

        ${generateInvoiceHTML(sale, sale.items, sale.total, sale.gstTotal)}
      </div>
    </div>
  </div>`;
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', function(e) {
  if (e.altKey && !e.ctrlKey && !e.shiftKey) {
    if (e.key === '1') { e.preventDefault(); showView('dashboard'); }
    else if (e.key === '2') { e.preventDefault(); showView('billing'); }
    else if (e.key === '3') { e.preventDefault(); showView('purchase'); }
    else if (e.key === '4') { e.preventDefault(); showView('stock'); }
    else if (e.key === '5') { e.preventDefault(); showView('settings'); }
    else if (e.key === 'g' || e.key === 'G') { e.preventDefault(); showGSTReport(); }
    else if (e.key === 't' || e.key === 'T') { e.preventDefault(); showTransferModal(); }
    else if (e.key === 'u' || e.key === 'U') { e.preventDefault(); showUdhaarModal(); }
  }
  if (e.key === 'Escape') closeModal();
  if (e.key === 'F2' && STATE.currentView === 'billing') {
    e.preventDefault();
    const sel = document.getElementById('billMedSelect');
    if (sel) sel.focus();
  }
});

// ============================================================
// INITIALIZATION
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  const branchSel = document.getElementById('globalBranch');
  const fySel = document.getElementById('globalFY');
  if (branchSel) branchSel.value = STATE.currentBranch;
  if (fySel) fySel.value = STATE.currentFY;
  renderCurrentView();
  updateGlobalNotif();
  lucide.createIcons();
  // Show welcome toast
  setTimeout(() => showToast('eatnbill Medical Cloud Suite loaded — Alt+1..5 for navigation'), 800);
});
</script>
</body>
